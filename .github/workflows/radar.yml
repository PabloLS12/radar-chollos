name: Radar de chollos

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "prueba o normal"
        default: "prueba"

permissions:
  contents: write

concurrency: radar

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Buscar chollos
        run: python3 radar.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: ${{ github.event.inputs.modo || 'normal' }}

      - name: Guardar memoria
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add seen.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "memoria" && git push)
